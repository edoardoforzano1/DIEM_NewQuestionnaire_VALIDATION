# critical_sets.yaml
# Validation rules for the GeoPoll and KoBo questionnaire validators.
# Edit this file to update rules when questionnaire structure changes.
# No code changes needed — the notebook loads this file automatically.
#
# Rule types:
#   exact_sets      — specific named questions that must be present (and optionally mandatory)
#   min_count_sets  — question groups that must reach a minimum count by prefix
#   fs_indicators   — FS indicator presence + CAPI ceiling check
#   agri_cs_check   — agriculture-related coping strategy minimum count via Conditional column
#   variable_pairs  — variable pairs where both must be present if either is
#   crop_harvest    — special rule: either the minimal set OR the full set must be present

# ── Exact question sets ────────────────────────────────────────────────────────
# All questions marked required: true must be present with the correct Mandatory flag.
# Questions marked required: false generate a warning (medium) if absent.
#
# NOTE: RCSI was NOT a critical set in the original GeoPoll validation.
# It is included here as an optional check — remove the RCSI block below if not needed.

# HDDS is no longer a critical set — it is treated as a regular template question
# and compared via the standard question presence / mandatory checks.
# Add entries here only for questions that need explicit critical-set handling
# beyond what the standard template comparison provides.
exact_sets: {}



# ── Prefix-based minimum count rules ──────────────────────────────────────────
# Any question whose name starts with `prefix` counts toward the minimum.
# The found question names are listed in the Critical Sets sheet for reference.
#
# CS rule: each respondent profile must receive at least 10 coping strategies
#          (4 STRESS + 3 CRISIS + 3 EMERGENCY).
#
# WEALTH rule: at least one wealth question must be present
#              (hh_wealth_* OR custom variant c_hh_wealth_*)
#              Examples: hh_wealth_toilet / c_hh_wealth_toilet
#              More than one is fine.
#
# relax_individual_mandatory: true — the template tags every question of the
#              set as mandatory, but only the min_count is really required.
#              While the set passes, removed_question / mandatory_to_optional /
#              mandatory_column_mismatch rows for its questions are downgraded
#              to info (still listed, so the change is visible).

min_count_sets:

  WEALTH:
    prefix: hh_wealth_
    min_count: 1
    relax_individual_mandatory: true
    description: "At least 1 wealth question required (hh_wealth_* or c_hh_wealth_*)"


  CS_stress:
    prefix: cs_stress
    min_count: 4
    description: "At least 4 STRESS coping strategy questions required (cs_stress_*)"

  CS_crisis:
    prefix: cs_crisis
    min_count: 3
    description: "At least 3 CRISIS coping strategy questions required (cs_crisis_*)"

  CS_emergency:
    prefix: cs_emergency
    min_count: 3
    description: "At least 3 EMERGENCY coping strategy questions required (cs_emergency_*)"

# ── Food security indicator rules ─────────────────────────────────────────────
# mandatory: indicators that must be present (at least one question with the
#            given prefix must exist in the questionnaire).
# optional:  indicators that are allowed but not required.
# capi_max:  maximum total FS indicators for CAPI modality (set modality in
#            validation_config.yaml under geopoll_options.modality).
#            Each indicator counts as 1 regardless of how many questions it has.
#
# To identify whether an indicator is present, the validator checks for at least
# one Q Name starting with anchor_prefix, or exactly matching anchor_qname.

fs_indicators:
  mandatory:
    FIES:
      anchor_prefix: "fies_"
      description: "Food Insecurity Experience Scale"
    FCS:
      anchor_prefix: "fcs_"
      description: "Food Consumption Score"
    LCSI:
      anchor_prefix: "cs_"
      description: "Livelihoods-based Coping Strategy Index (CS questions)"
  optional:
    HDDS:
      anchor_qname: "hdds"
      description: "Household Dietary Diversity Score"
    rCSI:
      anchor_prefix: "rcsi_"
      description: "Reduced Coping Strategy Index"
  capi_max: 4

# ── Agriculture-related coping strategy count ─────────────────────────────────
# CS questions (matching cs_prefixes) that have a Conditional referencing
# hh_agricactivity = 1/2/3 or income_main/sec/third = 1/2/3/4/6 count as
# agriculture-related CS.  At least min_agri_cs such questions are required.
#
# agri_signals list:
#   variable — exact variable name to look for in the Conditional text
#   values   — which values of that variable signal agricultural relevance

#   kobo_values — optional; KoBo choice names when they differ from the
#                 GeoPoll codes (KoBo reads the `relevant` column instead of
#                 Conditional and accepts both kobo_values and values)

agri_cs_check:
  cs_prefixes:
    - "cs_stress_"
    - "cs_crisis_"
    - "cs_emergency_"
  min_agri_cs: 4
  agri_signals:
    - variable: "hh_agricactivity"
      values: [1, 2, 3]
      kobo_values: ["crp", "ls", "fish"]
    - variable: "income_main"
      values: [1, 2, 3, 4, 6]
    - variable: "income_sec"
      values: [1, 2, 3, 4, 6]
    - variable: "income_third"
      values: [1, 2, 3, 4, 6]

# ── Variable pair rules ────────────────────────────────────────────────────────
# If either variable in a pair is present, the other must also be present.
# Each pair has a label (used in the issue message) and two q_names.

variable_pairs:
  - label: "crop land size"
    a: "crp_landsize_num"
    b: "crp_landsize_unit"
  - label: "crop harvest volume"
    a: "crp_harv_vol"
    b: "crp_harv_unit"
  - label: "crop sales price"
    a: "crp_salesprice_amount"
    b: "crp_salesprice_unit"
  - label: "livestock sales price"
    a: "ls_salesprice_amount"
    b: "ls_salesprice_unit"
  - label: "fish sales price"
    a: "fish_salesprice_amount"
    b: "fish_salesprice_unit"
  - label: "main livestock (computed ls_main + tie-break ls_main_confirm)"
    a: "ls_main_confirm"
    b: "ls_main"

# ── Crop harvest rule ──────────────────────────────────────────────────────────
# The questionnaire must contain EITHER:
#   - only the minimal set (just crp_harv_change), OR
#   - all questions in the full set (extras beyond the full set are allowed).
# Any other combination is flagged as a violation.

crop_harvest:
  minimal:
    - crp_harv_change
  full:
    - crp_harv_change
    - crp_harv_vol
    - crp_harv_unit
    - crp_harv_unit_kg
    - crp_harv_lastyr

# ── Fixed answer codes ─────────────────────────────────────────────────────────
# Questions whose answer codes must be exactly this set. Used where GeoPoll
# shows the options dynamically (only a subset is displayed) but must keep the
# fixed codes, so the list must not be renumbered, cut, or extended (e.g. with
# DON'T KNOW / REFUSED). Questions absent from the questionnaire are skipped.
#   q_name      — question to check
#   codes       — the exact code set required
#   description — shown in the report
#   severity    — optional, default high
#   kobo_codes  — optional; KoBo choice names when they differ from the
#                 GeoPoll codes (KoBo falls back to `codes` when absent)

fixed_option_codes:
  - q_name: ls_main_confirm
    codes: [1, 2, 3, 4, 5, 6, 7, 8]
    kobo_codes: [cattle, goat, sheep, swine, equine, smallmammals, poultry, camelid]
    description: "ls_main_confirm: 8 livestock types only (no Other / DK / REF), fixed codes"

# ── Tropical Livestock Unit weights ───────────────────────────────────────────
# The Additional information sheet carries a TLU weights table (one row per
# species) used to compute ls_main. Rows are found by the section banner left
# of the 'Original' column; they are excluded from placeholder replacement.
# Each species must have a numeric weight > 0, identical across languages.

tlu_weights:
  section_marker: "TROPICAL LIVESTOCK UNIT"
  species:
    - cattle
    - goat
    - sheep
    - swine
    - equine
    - small domesticated mammals
    - poultry
    - camelid
