# =============================================================================
#  DIEM Questionnaire Validation - Centralized Configuration
#  Edit ONLY this file. Never touch the notebook code.
# =============================================================================

# Which tool to run: kobo | geopoll
# Optional quick-switch profile file in config_profiles/ (or absolute path).
# Example: "geopoll_ar_yem_latest_template.yaml"
config_profile: ""

# Optional custom folder containing profile files.
# If empty, defaults to <output_dir>/config_profiles/
config_profiles_dir: ""

tool: "geopoll"

# =============================================================================
#  CORE SETTINGS  (used identically by both tools — change these each run)
# =============================================================================

# Working directory: input files are resolved relative to this folder.
working_dir: "C:/Temp"

# Current questionnaire filename (resolved under working_dir).
questionnaire_file: "diem_household_questionnaire_geopoll_yemen_20261022.xlsx"

# Language code: en | fr | ar | es
language: "ar"

# Languages checked in placeholder/replacement scans (KoBo + GeoPoll). Columns of other
# languages stay in the file untouched but are not reported, e.g. Arabic
# columns left over from the template in a FR/EN country. Empty = every
# filled language.  Example: ["en", "fr"]
languages_in_scope: []

# ISO3 country code
iso3: "YEM"

# Reference mode:
#   latest_template -> auto-detect newest matching file in templates_dir
#   previous_round  -> compare against previous_round_file in working_dir
reference_mode: "latest_template"

# Only used when reference_mode = previous_round
previous_round_file: "validated_questionnaire_kobo_ar_PSE_20250623155613.xlsx"

# Folder containing all template Excel files (read by the validators)
templates_dir: "c:/git/DIEM_NewQuestionnaire_VALIDATION/Template"

# Official template folder (DIEM Toolbox on SharePoint, synced by OneDrive).
# Before every run validate.py copies any newer/missing geopoll/kobo template
# from here into templates_dir, so latest_template always uses the newest
# version. Leave empty to disable. If the folder is unreachable the run
# continues with the templates already in templates_dir (with a warning).
templates_source_dir: "C:/Users/edoar/Food and Agriculture Organization/OER - 01. DIEM Monitoring/03. Toolbox/02. Questionnaires"

# Base output folder (DIEM questionnaire validation), split by tool:
#   geopoll_output/                    reports + validated questionnaires (GeoPoll)
#   geopoll_output/validation_cases/   one folder per country + round (agent)
#   kobo_output/ , kobo_output/validation_cases/   same for KoBo
#   configuration/                     config snapshot of each run
#   archive/<YYYY-MM>/                 files moved out by housekeeping
#   _agent_runs/                       agent scratch files (deleted after N days)
output_dir: "C:/Temp/DIEM_questionnaire_validation"

# Output housekeeping (runs before each validation execution).
housekeeping:
  enabled: true
  dry_run: false

  # Strict mode: keep limits apply immediately.
  keep_all_for_last_days: 0
  protect_today_files: false

  # Strict retention by identical output key (tool + type + iso3 + language + round).
  keep_reports_per_group: 3
  keep_validated_per_group: 3
  keep_config_snapshots_per_group: 30

  # Age-based trigger, applied IN ADDITION to (not instead of) the per-group
  # count limits above -- a file is archived if it's EITHER past its group's
  # keep-count OR older than this many days, whichever comes first (same
  # "rotate on size OR time" pattern as standard log rotation). 0 = disabled
  # (only the count limits above apply). The protective settings above
  # (keep_all_for_last_days, protect_today_files) always take precedence
  # over this trigger -- a file they protect is never archived by age.
  archive_older_than_days: 0

  # Cleanup flow:
  # 1) Move excess files to archive
  # 2) Delete archived files older than TTL
  archive_before_delete: true
  archive_dir: ""
  delete_archives_older_than_days: 180

  # Working files of agent runs (staged copies of the questionnaire, temporary
  # config profiles, run logs) in <output_dir>/_agent_runs/: deleted after this
  # many days, never archived. 0 = keep. Validation cases
  # (<tool>_output/validation_cases/) are records and are never touched.
  delete_agent_run_files_after_days: 7

# Module names to ignore in comparison (shared by KoBo and GeoPoll).
# Differences inside these modules are excluded from issue reporting.
# KoBo: accepts either the begin_group name or the visible group label.
# GeoPoll (new template): use the short module code from the survey's 'module'
# column (e.g. "resp_info", "shock"), not the section title text.
ignore_modules_from_comparison: []

# Module names to skip entirely from validated output (shared by KoBo and GeoPoll).
# These modules are excluded from comparison and removed from validated questionnaire output.
# GeoPoll (new template): use the short module code from the 'module' column
# (e.g. "resp_info", "shock"), not the section title text.
skip_modules_from_validated_output: []


# =============================================================================
#  KOBO-SPECIFIC OPTIONS  (only read by the kobo notebook)
# =============================================================================

kobo_options:
  # Optional: include admin3 fetch/rebuild from AGOL.
  # true  -> fetch admin3 and rebuild admin3 choices
  # false -> skip admin3 fetch and keep existing admin3 values untouched
  include_admin3: False

  # Optional: skip placeholder restore/replacement and crop-list rebuild.
  # true  -> keep already-personalized values as-is; do not use Additional information/Crop list
  # false -> run restore vanilla -> replace placeholders -> crop/admin rebuild
  skip_restore_and_replacement: false

  # Strict input requirements (applied when skip_restore_and_replacement=false).
  # If true and input is missing, validation reports explicit replacement input failures.
  require_additional_info: true
  require_crop_list: true

  # Choice list names treated as country-parameter lists (crop/admin/etc).
  country_specific_list_names:
    - "crop"
    - "crop2"
    - "crop3"
    - "admin1"
    - "admin2"
    - "admin3"
    - "crp_main_sales2"

  # Question names to skip from option-level comparison (temporary operational fields).
  exclude_qnames_from_option_compare:
    - "enumerator"
    - "enum_team"

  # Maximum allowed length for variable names (name column). Names exceeding
  # this are flagged as medium issues. 32 = Stata variable-name limit (the
  # 20261007 template's longest name is 29 characters).
  max_qname_length: 32

  # Survey modality: capi | cati
  # Controls whether the FS indicator ceiling check (capi_max in critical_sets.yaml) applies.
  modality: "capi"

# =============================================================================
#  GEOPOLL-SPECIFIC OPTIONS  (only read by the geopoll notebook)
# =============================================================================

geopoll_options:
  # Maximum allowed length for variable names (Q Name column).
  # Names exceeding this are flagged as medium issues.
  max_qname_length: 28

  # Survey modality: capi | cati
  # Controls whether the FS indicator ceiling check (capi_max in critical_sets.yaml) applies.
  modality: "cati"

  # Placeholders computed from another Additional information value rather
  # than typed by the country team (template 20261007+). The value is
  # repeat_digit repeated len(digits of source) + extra_digits times, e.g.
  # MAX AMOUNT = 10000000 -> $MAX DIGIT DK$ = 88888888, $MAX DIGIT REF$ = 99999999.
  # A value typed in the sheet always wins. Remove an entry to stop deriving it.
  derived_placeholders:
    MAX DIGIT DK:
      source: "MAX AMOUNT"
      repeat_digit: "8"
      extra_digits: 0
    MAX DIGIT REF:
      source: "MAX AMOUNT"
      repeat_digit: "9"
      extra_digits: 0

  # Closing options appended to the expanded crop lists (crp_all, crp_salesmain, ...)
  # as 91) no crop production / 92) don't know / 93) refused, per language column.
  # Wording taken from the 20261007 template; a language not listed uses English.
  crop_list_closing_options:
    EN: {no_crop: "No crop production", dont_know: "DON'T KNOW", refused: "REFUSED"}
    FR: {no_crop: "Aucune production végétale", dont_know: "NE SAIT PAS", refused: "REFUS"}
    AR: {no_crop: "عدم إنتاج المحاصيل", dont_know: "لا أعرف", refused: "رفض الاجابة"}

# Report metadata
validation_number: 1
user_name: "Edoardo"


