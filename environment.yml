name: diem-validation
channels:
  - conda-forge
  - defaults
dependencies:
  # Core runtime — required to run the validator
  - python=3.12
  - polars>=1.30
  - openpyxl>=3.1
  - pyyaml>=6.0
  - xlsxwriter>=3.0
  # Word documents for country teams (diem-validate skill)
  - python-docx>=1.1
  # Documentation — required to view the local docs site
  # Streamlit UI (app/) — optional front end over validate.py / tool_admin_*
  - ruamel.yaml>=0.18
  - pip
  - pip:
    - mkdocs>=1.6
    - mkdocs-material>=9.0
    - pymdown-extensions>=10.0
    - streamlit>=1.40
